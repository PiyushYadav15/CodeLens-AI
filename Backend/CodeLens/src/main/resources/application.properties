spring.application.name=CodeLens

# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ── PostgreSQL Database Configuration (with pgvector) ───────────────────────
# Connects to your local or cloud PostgreSQL instance running on port 5432
spring.datasource.url=jdbc:postgresql://localhost:5432/codelensdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=

# ── JPA / Hibernate for PostgreSQL ──────────────────────────────────────────
# update: adjusts table schemas automatically while preserving indexed data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── (Optional) H2 In-Memory Fallback ────────────────────────────────────────
# Uncomment below and comment out PostgreSQL if you want to run offline without Postgres:
# spring.datasource.url=jdbc:h2:mem:codelensdb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ── File Upload ─────────────────────────────────────────────────────────────
# Allows uploading ZIP files up to 50 MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── Gemini AI Configuration ─────────────────────────────────────────────────
# Get your free API key at: https://aistudio.google.com/ → "Get API key"
# Paste your key below (never commit a real key to git):
app.gemini.api-key=YOUR_GEMINI_API_KEY_HERE
app.gemini.embedding-model=text-embedding-004

# ── Groq AI Configuration ───────────────────────────────────────────────────
# Get your free API key at: https://console.groq.com/keys
# Groq provides high-speed LPU inference with models like Llama 3.3 70B
app.groq.api-key=YOUR_GROQ_API_KEY_HERE
app.groq.chat-model=llama-3.3-70b-versatile

# ── Async thread pool ────────────────────────────────────────────────────────
# Spring uses this pool for @Async methods (e.g. EmbeddingIndexingService).
# core-size = threads always kept alive
# max-size  = maximum threads under heavy load
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.thread-name-prefix=codelens-async-
